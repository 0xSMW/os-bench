  version: '1'
  parameters:
    contract_id: network.route.local
  probe: generic
  cases_per_contract: 10
timeouts:
  case_seconds: 20
  boot_seconds: 240
transport: host
workloads:
- http
- tcp
difficulty: advanced
status: accepted
tags:
