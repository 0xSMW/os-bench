schema_version: osbench.contract.v1
id: boot.init.start
title: Boot Init Start
domain: boot
level: boot
abstraction: boot
operation: init.start
description: Measures the externally observable Linux-compatible semantics of init start for the boot
  abstraction, including successful execution, errors, state changes, cleanup, composition, contention,
  and behavior under bounded resource pressure.
prerequisites:
- boot.clean.shutdown
- boot.firmware.uefi_entry
sources:
- type: linux
  reference: Linux kernel boot protocol and UEFI observable behavior
- type: book
  reference: Modern Operating Systems, 5th ed., relevant subsystem and design chapters
observables:
- boot_log
- serial_output
- exit_code
normalization:
- none
equivalence:
  type: semantic
  comparator: osbench.comparators.compare
invariants:
- The operation produces the same externally visible state relation as the pinned Debian reference.
- Successful completion preserves all unrelated process, filesystem, memory, device, and credential state.
- Repeated execution with the same initial state and seed remains within the Contract's declared equivalence
  relation.
error_conditions:
- Invalid arguments return the reference error without committing forbidden partial state.
- Insufficient permissions or resources fail with reference-compatible authorization and cleanup behavior.
state_transitions:
- initial -> operation in progress -> completed or rejected
- failure -> resources released -> known-good follow-up operation succeeds
cleanup_invariants:
- All evaluator-created resources are released or remain only when persistence is part of the Contract.
- A failed operation does not accumulate leaked descriptors, processes, memory, locks, sockets, or package
  state.
resource_invariants:
- Resource ownership and accounting match the observable reference relation.
- Exhaustion is bounded and leaves the system able to execute a known-good follow-up operation.
legal_nondeterminism:
- Opaque identifiers and scheduling order may differ only when explicitly normalized.
case_dimensions:
- primitive
- boundary
- state_transition
- composition
- concurrency
- isolation
- failure
- persistence
- exhaustion
- workload
- performance
orthogonal_with:
- boot.kernel.entry
- machine.cpu.mode_transition
fault_injection:
- interrupted_operation
- invalid_argument
- resource_exhaustion
generator:
  implementation: generators.common.contract_case
  version: '1'
  parameters:
    contract_id: boot.init.start
  probe: generic
  cases_per_contract: 10
timeouts:
  case_seconds: 20
  boot_seconds: 240
transport: host
workloads: []
difficulty: foundational
status: accepted
tags:
- behavioral
- boot
- linux
