compiler:
  command: /bin/sh -c 'd=$(mktemp -d); printf "#include <stdio.h>\nint main(){puts(\"ok\");}" > "$d/a.c"; cc "$d/a.c" -o "$d/a"; "$d/a"; rm -rf "$d"'
  contracts:
  - elf.dynamic_loader.basic
  - fs.file.write.basic
  - memory.mmap.file
  - process.execve.basic
  - workload.c.compile_link_run
  level: real_workloads
compression:
  command: /bin/sh -c 'd=$(mktemp -d); dd if=/dev/urandom of="$d/in" bs=4096 count=4 status=none; gzip -c "$d/in" > "$d/in.gz"; gzip -dc "$d/in.gz" > "$d/out"; cmp "$d/in" "$d/out"; echo compression-ok; rm -rf "$d"'
  contracts:
  - fs.file.write.basic
  - pipe.basic
  - workload.compression.roundtrip
  - workload.dynamic_elf
  level: real_workloads
coreutils_pipeline:
  command: /bin/sh -c 'printf \"zeta\\nalpha\\nbeta\\nalpha\\n\" | sort | uniq -c | grep alpha'
  contracts:
  - posix.utility.cat
  - posix.utility.grep
  - posix.utility.sort
  - shell.pipeline.basic
  - workload.coreutils.pipeline
  level: posix_userspace
dns:
  command: getent ahostsv4 localhost
  contracts:
  - distro.dns.configuration
  - network.dns.resolve
  - workload.dns.lookup
  level: real_workloads
dynamic_elf:
  command: /var/lib/osbench/workloads/dynamic-elf alpha beta
  contracts:
  - elf.argv_env
  - elf.auxv
  - elf.dynamic_loader.basic
  - workload.dynamic_elf
  level: real_workloads
git:
  command: /bin/sh -c 'd=$(mktemp -d); git init -q "$d"; echo x > "$d/f"; git -C "$d" add f; git -C "$d" status --porcelain; rm -rf "$d"'
  contracts:
  - fs.directory.create_remove
  - fs.file.rename.atomicity
  - fs.file.write.basic
  - workload.git.repository
  level: real_workloads
http:
  command: python3 /var/lib/osbench/workloads/fixtures/http_loopback.py
  contracts:
  - poll.socket.readiness
  - socket.tcp.loopback
  - thread.create_join
  - workload.http.server_client
  level: real_workloads
package:
  command: dpkg-query -W base-files
  contracts:
  - package.database.query
  - package.dpkg.status
  level: package_ecosystem
package_install:
  command: dpkg-deb --info /var/lib/osbench/packages/osbench-hello_0.1.0_all.deb
  contracts:
  - package.deb.install
  - package.deb.remove
  - package.maintainer.postinst
  - package.maintainer.preinst
  - workload.package.install
  level: package_ecosystem
pthread:
  command: /var/lib/osbench/workloads/pthread
  contracts:
  - sync.futex.wait_wake
  - sync.mutex.exclusion
  - thread.create_join
  - thread.tls
  - workload.pthread.program
  level: real_workloads
python:
  command: python3 -c 'import os,sqlite3,threading; print(os.getpid(),sqlite3.sqlite_version,threading.active_count())'
  contracts:
  - elf.dynamic_loader.basic
  - memory.mmap.anonymous
  - procfs.self.status
  - thread.create_join
  - workload.python.basic
  level: real_workloads
reboot_service:
  command: /bin/true
  contracts:
  - full.install_serve_reboot
  - package.deb.install
  - persistence.service.reboot
  - service.enable.start
  level: full_reconstruction
service:
  command: systemctl cat osbench-agent.service
  contracts:
  - package.service.install
  - service.enable.start
  - service.lifecycle.start_stop
  - workload.service.start
  level: real_workloads
shell:
  command: /bin/sh -c 'printf \"z\\na\\n\" | sort | head -n1'
  contracts:
  - fd.dup2.redirection
  - pipe.basic
  - process.execve.basic
  - process.fork.basic
  - process.wait.basic
  - shell.pipeline.basic
  level: posix_userspace
sqlite:
  command: python3 -c 'import sqlite3,tempfile,os;p=tempfile.mktemp();c=sqlite3.connect(p);c.execute(\"create table t(x)\");c.execute(\"insert into t values (1)\");c.commit();print(c.execute(\"select x from t\").fetchone()[0]);c.close();os.unlink(p)'
  contracts:
  - fs.file.fsync
  - fs.file.open
  - fs.file.rename.atomicity
  - fs.file.write.basic
  - memory.mmap.file
  - workload.sqlite.transaction
  level: real_workloads
ssh:
  command: /var/lib/osbench/workloads/fixtures/ssh_loopback.sh
  contracts:
  - permission.setuid_transition
  - service.lifecycle.start_stop
  - socket.tcp.stream_semantics
  - tty.pty
  - workload.ssh.loopback
  level: real_workloads
static_elf:
  command: /var/lib/osbench/workloads/static-elf
  contracts:
  - elf.static.load
  - fs.file.write.basic
  - process.execution
  - workload.static_elf
  level: real_workloads
tcp:
  command: python3 /var/lib/osbench/workloads/fixtures/tcp_loopback.py
  contracts:
  - poll.socket.readiness
  - process.fork.basic
  - socket.tcp.stream_semantics
  - workload.tcp.client_server
  level: real_workloads
