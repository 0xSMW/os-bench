d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string osbench-reference
d-i netcfg/get_domain string local
d-i mirror/country string manual
d-i mirror/http/hostname string
d-i mirror/http/directory string
d-i mirror/http/proxy string
d-i passwd/root-login boolean true
d-i passwd/root-password password osbench
d-i passwd/root-password-again password osbench
d-i passwd/make-user boolean false
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean false
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i pkgsel/include string openssh-server python3 python3-yaml python3-jsonschema sqlite3 gcc make git curl ca-certificates iproute2 procps strace systemd-sysv
tasksel tasksel/first multiselect standard
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string \
  cp -a /cdrom/osbench /target/root/osbench; \
  in-target /bin/sh /root/osbench/install.sh /root/osbench; \
  in-target /bin/sh -c "sed -i 's/^GRUB_CMDLINE_LINUX=.*/GRUB_CMDLINE_LINUX=\"console=tty0 console=ttyS0,115200n8\"/' /etc/default/grub"; \
  in-target update-grub; \
  in-target systemctl enable serial-getty@ttyS0.service; \
  in-target systemctl enable osbench-agent.service; \
  in-target sync
